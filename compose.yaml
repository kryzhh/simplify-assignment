services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gold-data:/app/data
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=2); c.request('GET','/health'); raise SystemExit(c.getresponse().status != 200)"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  gold-data:
